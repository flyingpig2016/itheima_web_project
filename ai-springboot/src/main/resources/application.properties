# ==========================================
# SpringBoot第一阶段学习 - 配置文件
# ==========================================

# 服务器端口
server.port=8080

# 应用名称
spring.application.name=ai-springboot-stage1

# 日志级别配置
# debug: 调试级别
# info: 信息级别
# warn: 警告级别
# error: 错误级别
logging.level.com.itheima.stage1=debug

# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

